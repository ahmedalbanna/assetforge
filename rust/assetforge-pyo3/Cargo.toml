[package]
name = "assetforge-pyo3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bridge for AssetForge Rust core library"

[lib]
name = "assetforge_pyo3"
crate-type = ["cdylib"]

[dependencies]
assetforge-core = { path = "../assetforge-core" }
pyo3 = { version = "0.21", features = ["extension-module"] }
numpy = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
